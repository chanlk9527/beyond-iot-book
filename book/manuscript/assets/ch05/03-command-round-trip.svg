<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">一次调光请求的往返过程</title><desc id="desc">应用提交请求，平台记录并返回命令编号，再向设备投递。设备受理并执行后返回关联反馈，平台向应用提供确认结果。时间从上向下，不按比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222;text-anchor:middle}rect{fill:#fff;stroke:#222;stroke-width:2;rx:3}.line{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.life{stroke:#555;stroke-width:2;stroke-dasharray:6 6}.note{font-size:18px}</style>
<rect x="0" y="0" width="720" height="510" style="stroke:none"/>
<rect x="25" y="20" width="150" height="46"/><text x="100" y="50">应用</text>
<rect x="285" y="20" width="150" height="46"/><text x="360" y="50">平台</text>
<rect x="545" y="20" width="150" height="46"/><text x="620" y="50">设备</text>
<path class="life" d="M100 66V493 M360 66V493 M620 66V493"/>
<path class="line" d="M100 112H360"/><text x="230" y="99">提交调光请求：70%</text>
<rect x="270" y="137" width="180" height="44"/><text x="360" y="165">校验并记录命令</text>
<path class="line" d="M360 214H100"/><text x="230" y="201">已受理：cmd_301</text>
<path class="line" d="M360 275H620"/><text x="490" y="262">投递命令 cmd_301</text>
<path class="line" d="M620 329H360"/><text x="490" y="316">设备受理反馈</text>
<rect x="535" y="352" width="170" height="44"/><text x="620" y="380">应用亮度参数</text>
<path class="line" d="M620 428H360"/><text x="490" y="415">关联命令的完成反馈</text>
<path class="line" d="M360 484H100"/><text x="230" y="471">返回已确认的结果</text>
</svg>
