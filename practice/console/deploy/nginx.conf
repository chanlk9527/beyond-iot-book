# Example server block. Set server_name, root and TLS at deployment time.
server {
    listen 80;
    server_name localhost;
    root /srv/nebula-console/dist;
    index index.html;

    location = /api/management/realtime/socket {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Ticket query parameters are ephemeral secrets; never record them in access logs.
        access_log off;
    }

    location = /mqtt {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        access_log off;
    }

    location /api/management/ {
        # Match the default 64 MiB file limit plus multipart fields.
        client_max_body_size 65m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
