spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  data:
    redis:
      url: ${REDIS_URL:}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:2000}ms
      connect-timeout: 3s
  application:
    name: nebula-iot-platform
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

nebula:
  eventbus:
    mode: ${EVENTBUS_MODE:local}
    node-id: ${EVENTBUS_NODE_ID:}
    namespace: ${EVENTBUS_NAMESPACE:nebula}
    topic: ${EVENTBUS_TOPIC:iot.platform.events.v1}
    failure-topic: ${EVENTBUS_FAILURE_TOPIC:iot.platform.events.failed.v1}
    handler-timeout: 30s
  management:
    enabled: false
  redis:
    enabled: ${REDIS_ENABLED:false}
  access:
    node-name: ${ACCESS_NODE_NAME:local-access}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
