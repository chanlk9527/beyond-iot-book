spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  data:
    redis:
      url: ${REDIS_URL:}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:2000}ms
      connect-timeout: 3s
  application:
    name: nebula-iot-platform
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

nebula:
  eventbus:
    mode: ${EVENTBUS_MODE:local}
    node-id: ${EVENTBUS_NODE_ID:}
    namespace: ${EVENTBUS_NAMESPACE:nebula}
    topic: ${EVENTBUS_TOPIC:iot.platform.events.v1}
    failure-topic: ${EVENTBUS_FAILURE_TOPIC:iot.platform.events.failed.v1}
    handler-timeout: 30s
    dubbo:
      host: ${EVENTBUS_DUBBO_HOST:127.0.0.1}
      port: ${EVENTBUS_DUBBO_PORT:20880}
      credential: ${EVENTBUS_DUBBO_CREDENTIAL:}
      maximum-pending: ${EVENTBUS_MAXIMUM_PENDING:100000}
      discovery: ${EVENTBUS_DUBBO_DISCOVERY:nacos}
      nacos:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:BEYOND_IOT}
        service: ${NACOS_EVENTBUS_SERVICE:nebula-eventbus}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  management:
    enabled: false
  redis:
    enabled: ${REDIS_ENABLED:false}
  access:
    node-name: ${ACCESS_NODE_NAME:local-access}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    websocket-enabled: ${MQTT_WEBSOCKET_ENABLED:true}
    websocket-port: ${MQTT_WEBSOCKET_PORT:-1}
