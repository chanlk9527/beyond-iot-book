spring:
  servlet:
    multipart:
      max-file-size: ${FILE_MULTIPART_MAX_FILE_SIZE:64MB}
      max-request-size: ${FILE_MULTIPART_MAX_REQUEST_SIZE:65MB}
      file-size-threshold: 0
  autoconfigure:
    exclude: []
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nebula}
    username: ${DATABASE_USERNAME:nebula}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations:
      - classpath:db/migration/identity
      - classpath:db/migration/tenant
      - classpath:db/migration/device
    clean-disabled: true
    baseline-on-migrate: false
nebula:
  files:
    enabled: ${FILES_ENABLED:false}
    bucket: ${FILES_BUCKET:}
    region: ${FILES_REGION:us-east-1}
    endpoint: ${FILES_ENDPOINT:}
    path-style-access: ${FILES_PATH_STYLE_ACCESS:false}
    access-key: ${FILES_ACCESS_KEY:}
    secret-key: ${FILES_SECRET_KEY:}
    maximum-upload-bytes: ${FILES_MAXIMUM_UPLOAD_BYTES:67108864}
    download-lifetime: ${FILES_DOWNLOAD_LIFETIME:PT10M}
  firmware:
    trusted-keys: {}
    report-maximum-age: ${FIRMWARE_REPORT_MAXIMUM_AGE:PT24H}
  history:
    provider: ${HISTORY_PROVIDER:disabled}
    maximum-retention-days: ${HISTORY_MAXIMUM_RETENTION_DAYS:3650}
    cleanup-interval-ms: ${HISTORY_CLEANUP_INTERVAL_MS:60000}
    tdengine:
      url: ${TDENGINE_URL:jdbc:TAOS-WS://127.0.0.1:6041/}
      username: ${TDENGINE_USERNAME:root}
      password: ${TDENGINE_PASSWORD:}
      database: ${TDENGINE_DATABASE:nebula_history}
  management:
    enabled: true
  cache:
    device:
      local-maximum-size: ${DEVICE_CACHE_LOCAL_MAXIMUM_SIZE:10000}
      local-ttl: ${DEVICE_CACHE_LOCAL_TTL:PT5M}
      redis-ttl: ${DEVICE_CACHE_REDIS_TTL:PT30M}
    model:
      local-maximum-size: ${MODEL_CACHE_LOCAL_MAXIMUM_SIZE:5000}
      local-ttl: ${MODEL_CACHE_LOCAL_TTL:PT10M}
      redis-ttl: ${MODEL_CACHE_REDIS_TTL:PT1H}
