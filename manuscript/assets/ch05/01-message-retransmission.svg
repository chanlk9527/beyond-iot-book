<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
<title id="title">两次采样与同一消息重传的区别</title>
<desc id="desc">左侧设备两次采样均为70，分别产生msg_111与msg_112。右侧一次采样的消息msg_111重传两次到达平台，仍为同一逻辑消息。时间向下，不按比例，虚线为生命线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222;text-anchor:middle}rect{fill:#fff;stroke:#222;stroke-width:2;rx:3}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.life{stroke:#555;stroke-width:2;stroke-dasharray:6 6}.heading{font-size:20px;font-weight:600}</style>
<rect width="720" height="410" style="stroke:none"/>
<text x="180" y="32" class="heading">两次采样，值相同</text>
<text x="540" y="32" class="heading">一次采样，消息重传</text>
<path d="M360 18V390" stroke="#555" stroke-width="1"/>
<rect x="20" y="54" width="90" height="42"/><text x="65" y="82">设备</text>
<rect x="260" y="54" width="90" height="42"/><text x="305" y="82">平台</text>
<rect x="370" y="54" width="90" height="42"/><text x="415" y="82">设备</text>
<rect x="610" y="54" width="90" height="42"/><text x="655" y="82">平台</text>
<path class="life" d="M65 96V326M305 96V326M415 96V326M655 96V326"/>
<text x="185" y="130">首次采样：70</text><text x="185" y="157">msg_111</text><path class="arrow" d="M65 174H305"/>
<text x="185" y="242">再次采样：70</text><text x="185" y="269">msg_112</text><path class="arrow" d="M65 286H305"/>
<text x="535" y="130">首次采样：70</text><text x="535" y="157">msg_111</text><path class="arrow" d="M415 174H655"/>
<text x="535" y="242">重传原消息：70</text><text x="535" y="269">msg_111</text><path class="arrow" d="M415 286H655"/>
<text x="180" y="358">两条逻辑消息</text><text x="180" y="386">新采样使用新编号</text>
<text x="540" y="358">一条逻辑消息，两次到达</text><text x="540" y="386">重传保留原编号</text>
</svg>