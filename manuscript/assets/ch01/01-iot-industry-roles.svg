<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
  <title id="title">一件智能产品背后的合作关系</title>
  <desc id="desc">部件与方案供应方向制造商提供部件与设计，制造商向品牌方提供成品，数字服务方向品牌方提供数字能力。品牌通过渠道与交付方向用户销售产品，并持续提供服务。箭头表示供给方向。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#222"/></marker>
  </defs>
  <rect width="720" height="490" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 125 110 V 210"/>
    <path d="M 210 249 H 270"/>
    <path d="M 360 110 V 210"/>
    <path d="M 450 249 H 510"/>
    <path d="M 600 288 V 382"/>
    <path d="M 360 288 V 421 H 510"/>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="2">
    <rect x="28" y="40" width="194" height="70" rx="3"/>
    <rect x="252" y="40" width="216" height="70" rx="3"/>
    <rect x="30" y="210" width="180" height="78" rx="3"/>
    <rect x="270" y="210" width="180" height="78" rx="3"/>
    <rect x="510" y="210" width="180" height="78" rx="3"/>
    <rect x="510" y="382" width="180" height="78" rx="3"/>
  </g>
  <g fill="#222" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle">
    <text x="125" y="69">部件与方案供应方</text>
    <text x="125" y="96">芯片 · 模组 · 设计</text>
    <text x="360" y="69">数字服务方</text>
    <text x="360" y="96">连接 · 平台 · 应用</text>
    <text x="120" y="241">设备制造商</text>
    <text x="120" y="268">生产与测试</text>
    <text x="360" y="241">品牌方</text>
    <text x="360" y="268">组织产品与体验</text>
    <text x="600" y="241">渠道与交付方</text>
    <text x="600" y="268">销售与安装</text>
    <text x="600" y="413">用户</text>
    <text x="600" y="440">购买与使用</text>
    <text x="240" y="237">成品</text>
    <text x="480" y="237">产品</text>
    <text x="184" y="166">部件与设计</text>
    <text x="410" y="166">数字能力</text>
    <text x="651" y="340">销售交付</text>
    <text x="432" y="407">持续服务</text>
  </g>
</svg>
